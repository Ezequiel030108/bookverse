# TEMPORÁRIO: mede a velocidade do site (Lighthouse, celular, como o
# PageSpeed Insights) a partir de um servidor do GitHub, com internet de
# verdade. Mede os endereços de .github/lighthouse/urls.txt, 3 vezes cada,
# e escreve o resumo no log. Sai do repositório antes do merge.
name: Medir velocidade (Lighthouse)

on:
  push:
    branches:
      - ccr-450bc3c6-b8u8de
    paths:
      - ".github/lighthouse/**"
      - ".github/workflows/lighthouse-medicao.yml"

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar o Lighthouse
        run: npm install -g lighthouse@12.8.2
      - name: Medir
        run: |
          mkdir -p rel
          n=0
          while read -r url; do
            [ -z "$url" ] && continue
            n=$((n+1))
            for i in 1 2 3; do
              lighthouse "$url" --quiet --output=json --output-path="rel/u${n}-r${i}.json" \
                --only-categories=performance,accessibility,best-practices,seo \
                --chrome-flags="--headless=new --no-sandbox" || true
              node -e 'const r=require(process.argv[1]);console.log(process.argv[1], "perf="+Math.round(r.categories.performance.score*100), "LCP="+r.audits["largest-contentful-paint"].displayValue, "TBT="+r.audits["total-blocking-time"].displayValue, "CLS="+r.audits["cumulative-layout-shift"].displayValue, "FCP="+r.audits["first-contentful-paint"].displayValue, "SI="+r.audits["speed-index"].displayValue)' "$PWD/rel/u${n}-r${i}.json" || true
            done
            # Resumo detalhado da rodada mediana (pela nota de desempenho).
            med=$(node -e 'const fs=require("fs");const n=process.argv[1];const fsx=[1,2,3].map(i=>"rel/u"+n+"-r"+i+".json").filter(f=>fs.existsSync(f));const s=fsx.map(f=>[f,require(process.cwd()+"/"+f).categories.performance.score]).sort((a,b)=>a[1]-b[1]);console.log(s[Math.floor(s.length/2)][0])' "$n")
            echo "================ MEDIANA: $url ($med) ================"
            node .github/lighthouse/resumo.js "$med"
          done < .github/lighthouse/urls.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: rel/
