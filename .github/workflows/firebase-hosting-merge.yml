# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Atualiza a "foto" dos livros já vendidos (js/vendidos.js) antes de
      # publicar. É o ponto de partida que a loja usa quando a resposta do
      # Firebase demora — sem isso, numa internet ruim, um livro vendido
      # apareceria na estante até a resposta chegar. Se o Firebase não
      # responder, o script mantém o arquivo anterior e a publicação segue.
      - name: Atualizar a lista de livros vendidos
        run: node scripts/gerar-vendidos.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOOKVERSE_69878 }}
          channelId: live
          projectId: bookverse-69878
