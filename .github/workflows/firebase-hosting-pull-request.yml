name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # A prévia sai igual ao site de verdade: com as "fotos" dos vendidos e
      # dos livros do painel (veja firebase-hosting-merge.yml).
      - name: Atualizar as fotos dos vendidos e dos livros do painel
        run: |
          node scripts/gerar-vendidos.js
          node scripts/gerar-catalogo-foto.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOOKVERSE_69878 }}
          projectId: bookverse-69878
