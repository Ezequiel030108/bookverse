# Roda os testes automáticos em todo pull request: as regras do banco
# (firestore.rules) e o fechamento de pedidos no servidor (valor do Pix,
# estoque, confirmação do pagamento). Tudo no EMULADOR do Firebase —
# nenhum teste toca a loja de verdade. Se ficar vermelho, NÃO junte o PR.
name: Testes (pedidos e regras do banco)

on:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # O emulador do Firestore roda em Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências
        run: |
          npm ci --prefix functions
          npm ci --prefix testes

      - name: Rodar os testes no emulador do Firebase
        run: testes/node_modules/.bin/firebase emulators:exec --project demo-bookverse --only firestore,auth "npm test --prefix testes"
